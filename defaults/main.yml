---
# Repo
jitsi_docker_repo_rev: 'stable-11248'
jitsi_docker_repo_url: 'https://github.com/jitsi/docker-jitsi-meet.git'

# Containers
jitsi_cont_name: 'jitsi'
jitsi_cont_vol: '/docker/{{ jitsi_cont_name }}'
jitsi_cont_restart_policy: 'unless-stopped'

# General
jitsi_domain: ~
jitsi_admin_email: ~
jitsi_timezone: 'Europe/Amsterdam'
jitsi_prosody_log_level: info

# TURN, STUN
# jitsi_coturn_auth_secret: ~
# TODO: fix TLS and switch TURN to udp
jitsi_turn_transport: tcp
# jitsi_turn_host: 'turn.example.org'
jitsi_turn_port:  3478
jitsi_turns_port: 5349
# jitsi_stun_host: 'stun.example.org'
jitsi_stun_port:  3478

# acme.sh default
jitsi_letsencrypt_acme_server: 'zerossl'

# Ports, the https one is not used
jitsi_web_http_port: 8000
jitsi_web_https_port: 8443
jitsi_jvb_udp_port: 10000

# List of IPs advertised to clients as JVB candidates.
# Empty falls back to the interface address (and STUN discovered public IPs).
# Set when the host is behind a reserved/floating IP, which differs from the interface address.
#jitsi_jvb_advertise_ips: ['200.200.200.200']

# Secrets
jitsi_jicofo_component_secret: ~
jitsi_jicofo_auth_password: ~
jitsi_jvb_auth_password: ~
jitsi_jibri_recorder_password: ~
jitsi_jibri_xmpp_password: ~

# Compose
compose_recreate: false
compose_destroy: false
compose_restart: false
